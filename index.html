<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ACTech Hub</title>
    <link rel="icon" href="/ac-tech-logo-pdf.png" type="image/png" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a1f4e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ACTech Hub" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    
    <!-- Standard Meta Tags -->
    <meta name="description" content="AC Tech Repair internal service management portal for tracking client device repairs and service requests">
    <meta name="author" content="AC Tech Repair PH" />
    <meta property="og:title" content="AC Tech Repair - Service Hub">
    <meta property="og:description" content="Internal service management portal for tracking client device repairs">
    <meta property="og:type" content="website">
    
    <!-- GitHub Pages SPA Redirect Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          var path = l.pathname;
          if (path.length > 1 && path.endsWith('/')) {
            path = path.slice(0, -1);
          }
          // Avoid double slash when path is '/' and decoded starts with '/'
          var cleanPath = (path === '/' && decoded.startsWith('/')) ? decoded : path + decoded;
          window.history.replaceState(null, null, cleanPath + l.hash);
        }
      }(window.location))
    </script>
  </head>

  <body>
    <div id="root">
      <div id="app-bootstrap" role="status" aria-live="polite">
        <style>
          #app-bootstrap {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1f4e;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          }
          #app-bootstrap > div { text-align: center; padding: 24px; }
          #app-bootstrap img { width: 112px; height: 112px; object-fit: contain; }
          #app-bootstrap p { margin: 14px 0 0; font-size: 14px; }
        </style>
        <div>
          <img src="/pwa-192x192.png" alt="ACTech Hub" />
          <p>Opening ACTech Hub…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
