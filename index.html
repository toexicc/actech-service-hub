<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ACTech Hub</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a1f4e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ACTech Hub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    
    <!-- Standard Meta Tags -->
    <meta name="description" content="AC Tech Repair internal service management portal for tracking client device repairs and service requests">
    <meta name="author" content="Stack&Scale" />
    <meta property="og:title" content="AC Tech Repair - Service Hub">
    <meta property="og:description" content="Internal service management portal for tracking client device repairs">
    <meta property="og:type" content="website">
    
    <!-- Safari detection - runs before React to prevent white screen -->
    <script>
      (function(){
        var ua = navigator.userAgent;
        var isSafari = /AppleWebKit/.test(ua) && /Safari/.test(ua) && !/Chrome|CriOS|Chromium|FxiOS|Firefox/.test(ua);
        if (isSafari) document.documentElement.dataset.browser = 'safari';
      })();
    </script>
    
    <!-- GitHub Pages SPA Redirect Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          var path = l.pathname;
          if (path.length > 1 && path.endsWith('/')) {
            path = path.slice(0, -1);
          }
          window.history.replaceState(null, null, path + decoded + l.hash);
        }
      }(window.location))
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
